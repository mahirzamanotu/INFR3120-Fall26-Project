<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CampusMarket logo">
  <!-- CampusMarket logo, designed for this project. -->
  <!-- It shows a price tag (buying and selling) wearing a graduation cap (students). -->

  <!-- Price tag body, tilted slightly -->
  <g transform="rotate(-12 32 38)">
    <path d="M14 26h26l12 12-12 12H14a4 4 0 0 1-4-4V30a4 4 0 0 1 4-4Z" fill="#4f46e5"/>
    <!-- Hole in the tag -->
    <circle cx="41" cy="38" r="3.2" fill="#ffffff"/>
    <!-- Dollar sign on the tag -->
    <text x="24" y="44.5" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">$</text>
  </g>

  <!-- Graduation cap on top of the tag -->
  <path d="M8 15 30 7l22 8-22 8Z" fill="#f59e0b"/>
  <path d="M16 18v6c0 3 6.5 5.5 14 5.5S44 27 44 24v-6l-14 5Z" fill="#d97706"/>
  <!-- Tassel -->
  <path d="M48 16.5v9" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <circle cx="48" cy="27" r="2" fill="#f59e0b"/>
</svg>